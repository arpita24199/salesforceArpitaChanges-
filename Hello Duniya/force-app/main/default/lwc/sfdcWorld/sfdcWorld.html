<template>
     
    <lightning-card  title="One Way Data Binding">
        <div>{fullname}</div>
        <div> {details.name}</div>  
    </lightning-card>


    <lightning-card  title="Two Way Data Binding">
    <div class="slds-m-around_large">
        <lightning-input type="text" label="Enter your full name"  onkeyup={changeHandler}></lightning-input>
        <div> MyName is{fullname} and my age is {age}</div>
    </div>
    </lightning-card>

    <lightning-card  title="@Track property">
        <div class="slds-m-around_large">
            <lightning-input type="text" label="Enter your address name"  onkeyup={changeTrack}></lightning-input>
            <div> My place is {details.place} and I am testing arrayList {arrayTest} </div>
        </div>
        </lightning-card>
</template>
