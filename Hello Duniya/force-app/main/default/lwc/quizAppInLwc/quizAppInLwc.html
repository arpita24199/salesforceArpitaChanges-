<!-- sldsValidatorIgnore -->
<template>
 <lightning-card title="Quiz App in LWC">
    <div class= "slds-var-m-around_medium">
        <template if:true={isSubmitted}>
        <div class={isScoredFull}>You have scored {correctAnswers} out of{myQuestions.length}</div>
        </template>
        <form>
   <template for:each={myQuestions} for:item="quiz">
    <div key={quiz.id} class= "slds-var-m-bottom_medium">
        <div> <strong>{quiz.id} - {quiz.question} </strong></div>
        <div class="slds-grid slds-gutters slds-var-p-around_medium">
    
            <div class="slds-col">
            <input type="radio" name={quiz.id} value="a" onclick={changeHandler}/>
            <span>{quiz.answers.a}</span>
            </div>
            <div class="slds-col">
            <input type="radio" name={quiz.id} value="b" onclick={changeHandler}/>
            <span>{quiz.answers.b}</span>
            </div>
            <div class="slds-col">
            <input type="radio" name={quiz.id} value="c" onclick={changeHandler}/>
            <span>{quiz.answers.c}</span>
            </div>
            </div>
    </div>
   </template>
   <lightning-button variant="brand"
                     type="submit"  
                     label="Submit" 
                     title="Submit Quiz"
                     class="slds-var-m-around_medium"
                     disabled={allNotSelected}
                     onclick ={submitHandler}>
    </lightning-button>
    <!-- <button class="slds-button slds-button_brand slds-text-link_reset
                     slds-var-m-around_medium"
                     title="Reset Quiz"
                     onclick ={resetHandler}>
                     Reset
    </button> -->
    <lightning-button 
                variant="brand" 
                type="reset"
                label="Reset"
                title="Reset Quiz"
                onclick={resetHandler}
                class="slds-m-around_small"></lightning-button>

  </form>
    </div>
 </lightning-card>   
</template>
