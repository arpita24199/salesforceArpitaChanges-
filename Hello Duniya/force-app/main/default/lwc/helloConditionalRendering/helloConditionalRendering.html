<template>
    <lightning-card title="Conditional Rendering">
        <div class="slds-var-m-around_large">
            <lightning-button variant="brand" 
                              label="Show Data" 
                              title="Show Data" 
                              onclick={handleClick} 
                              class="slds-var-m-left_x-small"></lightning-button>
        <template if:true={isVisible}>
            <div> Welcome to Hero to Zero Course</div>
        </template> 
        <template if:false={isVisible}>
            <div> please click the button</div>
        </template>  
        
        <lightning-input type="text" label="Type hello to show the data" onkeyup={changeHandler}></lightning-input>
        
        <template if:true={helloMethod}>
            <div>Hurray you have type correctly</div>
        </template>
      
        </div>
    </lightning-card>
</template>
